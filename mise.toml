[env]
MISE_USE_VERSIONS_HOST = "0"

# NOTE: `lua` (the interpreter, used only by the `test` task) is intentionally
# NOT a mise tool here. mise builds Lua from source via lua.org, which is
# unreliable from CI runners. Install it from your OS instead
# (`brew install lua` / `apt-get install lua5.4`), or run tests with
# `mise x lua@5.4 -- lua test/run.lua` locally. CI installs it via apt/brew.
[tools]
actionlint = "latest"
hk = "latest"
lua-language-server = "latest"
pkl = "latest"
stylua = "latest"

[tasks.format]
description = "Format Lua scripts"
run = "stylua metadata.lua hooks/ lib/ test/"

[tasks.test]
description = "Run offline unit tests (pure logic; no network/mise modules)"
run = "lua test/run.lua"

[tasks.lint]
description = "Lint Lua scripts and GitHub Actions using hk"
run = "hk check"

[tasks.lint-fix]
description = "Fix linting issues"
run = "hk fix"

[tasks.ci]
description = "Run all CI checks"
depends = ["lint", "test"]

[tasks.e2e]
description = "Live smoke test against a real origin (needs MISE_GITHUB_TOKEN + an origin)"
run = "mise-tasks/e2e"
